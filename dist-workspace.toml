[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Whether to publish GitHub attestations for the artifacts
github-attestations = true
# Message printed when the shell installer finishes
install-success-msg = "Wolkom! syk is installed. Run 'syk --setup' for shell completions & s, or 'syk --setup welcome' for a quick tour."

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"

[dist.min-glibc-version]
aarch64-unknown-linux-gnu = "2.34"
x86_64-unknown-linux-gnu = "2.34"
