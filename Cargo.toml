[package]
name = "syk-search"
version = "0.1.0"
edition = "2024"
description = "Search folder names, file names and file contents in one pass."
license = "MIT"
keywords = ["search", "grep", "find", "regex", "cli"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "syk"
path = "src/main.rs"

[dependencies]
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
