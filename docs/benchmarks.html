<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>syk benchmarks</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --raised: #f1f0ec;
  --line: #dddcd6;
  --text: #0b0b0b;
  --soft: #52514e;
  --index: #2a78d6;
  --syk: #1baf7a;
  --rg: #eb6834;
  --fd: #eda100;
  --find: #e87ba4;
  --grep: #6250d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #1a1a19;
    --raised: #262624;
    --line: #3a3a37;
    --text: #f0efec;
    --soft: #c3c2b7;
    --index: #3987e5;
    --syk: #199e70;
    --rg: #d95926;
    --fd: #c98500;
    --find: #d55181;
    --grep: #9085e9;
  }
}
body {
  margin: 0;
  padding: 32px 16px 48px;
  background: var(--surface);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 760px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
h2 { font-size: 15px; font-weight: 600; margin: 30px 0 2px; }
p { margin: 0 0 8px; }
.soft { color: var(--soft); }
.setup { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 14px 0; }
.setup dt { color: var(--soft); }
.setup dd { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 18px 0 8px; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.case { padding: 10px 0 7px; border-top: 1px solid var(--line); margin-top: 8px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; margin-bottom: 4px; }
.name { font-weight: 500; }
.row { display: flex; align-items: center; gap: 8px; height: 21px; border-radius: 4px; outline: none; }
.row:hover, .row:focus-visible { background: var(--raised); }
.tool { flex: 0 0 72px; text-align: right; white-space: nowrap; color: var(--soft); }
.track { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.bar { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; flex: none; }
.value { white-space: nowrap; font-variant-numeric: tabular-nums; }
.best { font-weight: 600; }
#tip {
  position: fixed;
  display: none;
  z-index: 5;
  max-width: 320px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--raised);
  font-size: 12.5px;
  pointer-events: none;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
}
#tip b { font-weight: 600; }
#tip code, .setup code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
#tip code { display: block; margin-top: 6px; word-break: break-all; color: var(--soft); }
details { margin-top: 24px; }
summary { cursor: pointer; color: var(--soft); }
details p { margin-top: 8px; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 3px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; white-space: normal; }
th { font-weight: 500; color: var(--soft); }
</style>
</head>
<body>
<main>
<h1>syk benchmarks</h1>
<p class="soft">syk next to ripgrep, fd, find and grep, on searches where every tool prints the same results. Measured with <code>scripts/bench.py</code>.</p>
<dl class="setup" id="setup"></dl>
<p class="soft" id="reading"></p>
<div class="legend" id="legend"></div>
<div id="chart"></div>
<details><summary>How it was measured</summary><p class="soft" id="method"></p></details>
<details><summary>All numbers as a table</summary><table id="table"></table></details>
</main>
<div id="tip"></div>
<script>
const DATA = {"setup": {"runs": 11, "shown": [["Measured", "2026-11-23"], ["Tools", "syk 0.1.1 at commit ad7be1a, ripgrep 15.2.0, fd 10.5.0, find (GNU findutils) 4.11.0-modified, grep (GNU grep) 3.12-modified"], ["Machine", "16 threads, load average 19.2 at the start"], ["Runs", "11 for every tool in every case"]], "method": "Every case runs each tool from the same folder with its output going into a pipe. Before anything is timed the outputs are compared as sets, and a case whose tools disagree is reported as DIFFERENT. A carriage return at the end of a line is left out of the comparison, because syk drops it and ripgrep prints it. The tools take turns within every round, which spreads background load evenly. cpu is the user and system time of the process, added over its threads, and moves less than the wall time when the machine is busy. The exit status is 1 when any case disagrees. --cold drops the file data of the code folder from memory before every timed run of a content search. It uses posix_fadvise, which needs no root. Folder listings stay in memory, so this measures reading files from disk and not listing them. syk walks the folders, like the other tools. syk index is syk with an index of names and of the text in files that was built before the timing, in a temporary cache folder. It is left out where no index can be built. --html writes the results as a page with charts."}, "sections": [{"h": "Names, plain search", "s": "Hidden and ignored entries are left out. Searched in /usr.", "c": [{"n": "rare name", "w": "entries whose name contains libssl", "r": "12 results", "t": [["syk index", 9.1, 8.2, 70, "syk -U -u all -s -n libssl"], ["syk", 52.8, 49.8, 554, "syk -U -Y -u all -s -n libssl"], ["fd", 113.9, 106.1, 1393, "fd --no-global-ignore-file -s libssl"], ["find", 822.6, 793.0, 800, "find . -mindepth 1 -name .* -prune -o -name *libssl* -print"]]}, {"n": "regex on names", "w": "entries whose name starts with lib and has .so in it", "r": "10,549 results", "t": [["syk index", 10.3, 9.5, 76, "syk -U -u all -s -n ^lib.*\\.so"], ["syk", 55.0, 52.1, 573, "syk -U -Y -u all -s -n ^lib.*\\.so"], ["fd", 115.8, 110.0, 1420, "fd --no-global-ignore-file -s ^lib.*\\.so"], ["find", 738.7, 706.8, 734, "find . -mindepth 1 -name .* -prune -o -name lib*.so* -print"]]}, {"n": "folder names", "w": "folders whose name contains python", "r": "173 results", "t": [["syk index", 12.3, 9.2, 87, "syk -U -u all -s -d python"], ["syk", 62.1, 45.3, 521, "syk -U -Y -u all -s -d python"], ["fd", 146.4, 110.2, 1398, "fd --no-global-ignore-file -s -t d python"], ["find", 921.5, 783.5, 912, "find . -mindepth 1 -name .* -prune -o -type d -name *python* -print"]]}, {"n": "extension and size", "w": ".so files of 1 MiB or more", "r": "293 results", "t": [["syk index", 14.0, 13.8, 132, "syk -U -u all -t file .so +1mb"], ["syk", 47.4, 44.8, 500, "syk -U -Y -u all -t file .so +1mb"], ["fd", 123.0, 120.0, 1578, "fd --no-global-ignore-file -t f -e so -S +1mi"], ["find", 802.2, 780.0, 799, "find . -mindepth 1 -name .* -prune -o -type f -name *.so -size +1048575c -print"]]}]}, {"h": "Names, everything included", "s": "Hidden and ignored entries are listed too. No index applies here. Searched in /usr.", "c": [{"n": "rare name", "w": "entries whose name contains libssl", "r": "12 results", "t": [["syk", 50.7, 48.8, 534, "syk -U -Y -u all -a -s -n libssl"], ["fd", 82.3, 77.3, 1013, "fd --no-global-ignore-file -u -s libssl"], ["find", 631.4, 619.9, 628, "find . -name *libssl*"]]}, {"n": "regex on names", "w": "entries whose name starts with lib and has .so in it", "r": "10,549 results", "t": [["syk", 51.9, 50.1, 554, "syk -U -Y -u all -a -s -n ^lib.*\\.so"], ["fd", 87.4, 83.5, 1051, "fd --no-global-ignore-file -u -s ^lib.*\\.so"], ["find", 575.3, 559.3, 571, "find . -name lib*.so*"]]}, {"n": "folder names only", "w": "folders whose name contains python", "r": "173 results", "t": [["syk", 46.7, 42.9, 481, "syk -U -Y -u all -a -s -d python"], ["fd", 82.5, 78.0, 1013, "fd --no-global-ignore-file -u -s -t d python"], ["find", 645.8, 616.4, 640, "find . -type d -name *python*"]]}, {"n": "extension and size", "w": ".so files of 1 MiB or more", "r": "293 results", "t": [["syk", 46.9, 43.8, 488, "syk -U -Y -u all -a -t file .so +1mb"], ["fd", 101.6, 94.5, 1208, "fd --no-global-ignore-file -u -t f -e so -S +1mi"], ["find", 644.2, 631.2, 640, "find . -type f -name *.so -size +1048575c"]]}, {"n": "extension and age", "w": ".py files changed in the last 30 days", "r": "6,387 results", "t": [["syk", 48.2, 45.6, 507, "syk -U -Y -u all -a -t file .py -30d"], ["fd", 97.6, 95.1, 1220, "fd --no-global-ignore-file -u -t f -e py --changed-within 720h"], ["find", 649.6, 634.8, 644, "find . -type f -name *.py -mtime -30"]]}, {"n": "extension, size and age", "w": ".h files of 100 KiB or more, older than a year", "r": "28 results", "t": [["syk", 53.2, 50.0, 577, "syk -U -Y -u all -a -t file .h +100kb +365d"], ["fd", 106.8, 104.6, 1354, "fd --no-global-ignore-file -u -t f -e h -S +100ki --changed-before 8760h"], ["find", 700.8, 675.3, 694, "find . -type f -name *.h -size +102399c -mtime +364"]]}]}, {"h": "Contents, plain search", "s": "Hidden and ignored files are left out. Searched in ~/.cargo/registry/src.", "c": [{"n": "regex in every file", "w": "lines matching a regular expression", "r": "1,449 results", "t": [["syk index", 38.7, 32.0, 281, "syk -U -u all -s -c fn \\w+_unchecked\\("], ["syk", 99.7, 83.1, 950, "syk -U -Y -u all -s -c fn \\w+_unchecked\\("], ["rg", 124.1, 99.6, 1120, "rg --no-config -n --no-heading fn \\w+_unchecked\\("]]}, {"n": "regex in every file, one thread", "w": "the same search on a single thread", "r": "1,449 results", "t": [["syk index", 295.4, 215.7, 261, "syk -U -u all -s -j 1 -c fn \\w+_unchecked\\("], ["syk", 932.3, 715.3, 875, "syk -U -Y -u all -s -j 1 -c fn \\w+_unchecked\\("], ["rg", 1235.4, 904.4, 1177, "rg --no-config -n --no-heading -j 1 fn \\w+_unchecked\\("]]}, {"n": "whole word, plain text", "w": "lines with the word transmute", "r": "20,153 results", "t": [["syk index", 32.9, 30.3, 242, "syk -U -u all -s -F -w -c transmute"], ["syk", 98.1, 90.0, 953, "syk -U -Y -u all -s -F -w -c transmute"], ["rg", 122.7, 110.1, 1135, "rg --no-config -n --no-heading -F -w transmute"]]}, {"n": "regex in .rs files only", "w": "TODO or FIXME in files ending in .rs", "r": "11,353 results", "t": [["syk index", 27.8, 26.0, 229, "syk -U -u all -s -c TODO|FIXME .rs"], ["syk", 69.2, 60.7, 678, "syk -U -Y -u all -s -c TODO|FIXME .rs"], ["rg", 94.5, 77.9, 827, "rg --no-config -n --no-heading TODO|FIXME -g *.rs"]]}, {"n": "content in files named *build*", "w": "cfg( in files whose name contains build", "r": "2,102 results", "t": [["syk index", 6.5, 5.5, 29, "syk -U -u all -s -n build -c cfg\\("], ["syk", 24.2, 18.9, 189, "syk -U -Y -u all -s -n build -c cfg\\("], ["rg", 38.3, 28.1, 261, "rg --no-config -n --no-heading cfg\\( -g *build*"]]}, {"n": "content below folders named *tests*", "w": "assert_eq! below folders whose name contains tests", "r": "64,347 results", "t": [["syk index", 17.0, 13.4, 101, "syk -U -u all -s -d tests -c assert_eq!"], ["syk", 32.2, 28.7, 275, "syk -U -Y -u all -s -d tests -c assert_eq!"], ["rg", 49.9, 44.6, 377, "rg --no-config -n --no-heading assert_eq! -g **/*tests*/**"]]}, {"n": "two words on one line", "w": "lines with both pub and unsafe, in either order", "r": "30,999 results", "t": [["syk index", 53.4, 51.1, 402, "syk -U -u all -s pub unsafe -c"], ["syk", 105.2, 94.2, 974, "syk -U -Y -u all -s pub unsafe -c"], ["rg", 153.3, 142.5, 1435, "rg --no-config -n --no-heading pub.*unsafe|unsafe.*pub"]]}, {"n": "matches counted per file", "w": "the number of lines with unsafe, per file", "r": "12,628 results", "t": [["syk index", 50.7, 45.7, 397, "syk -U -u all -s -c unsafe -N"], ["syk", 98.5, 91.2, 969, "syk -U -Y -u all -s -c unsafe -N"], ["rg", 122.2, 107.2, 1134, "rg --no-config -c unsafe"]]}, {"n": "files that contain a match", "w": "paths of files with async fn", "r": "3,384 results", "t": [["syk index", 31.8, 25.1, 227, "syk -U -u all -s -c async fn -l"], ["syk", 107.5, 86.9, 951, "syk -U -Y -u all -s -c async fn -l"], ["rg", 115.8, 103.6, 1083, "rg --no-config -l async fn"]]}, {"n": "names and contents together", "w": "serde_json in folder names, file names and lines", "r": "10,985 results", "t": [["syk index", 26.3, 24.7, 198, "syk -U -u all -s serde_json"], ["syk", 81.8, 76.6, 904, "syk -U -Y -u all -s serde_json"], ["rg + fd", 121.5, 119.6, 1287, "sh -c rg --no-config -n --no-heading serde_json; fd --no-global-ignore-file -s serde_json"]]}]}, {"h": "Contents, everything included", "s": "Hidden and ignored files are searched too, which is all that grep can do. Searched in ~/.cargo/registry/src.", "c": [{"n": "plain text in every file", "w": "unsafe impl in every file that is not binary", "r": "10,962 results", "t": [["syk", 82.5, 78.1, 899, "syk -U -Y -u all -s -a -c unsafe impl"], ["rg", 98.6, 92.7, 1023, "rg --no-config -n --no-heading -uu unsafe impl"], ["grep", 1045.5, 1009.1, 1037, "grep -rnI unsafe impl ."]]}, {"n": "whole word in every file", "w": "the word transmute in every file that is not binary", "r": "20,153 results", "t": [["syk", 94.0, 84.1, 925, "syk -U -Y -u all -s -a -F -w -c transmute"], ["rg", 110.7, 101.4, 1044, "rg --no-config -n --no-heading -uu -F -w transmute"], ["grep", 1201.9, 1126.5, 1189, "grep -rnIFw transmute ."]]}, {"n": "regex in .rs files", "w": "TODO or FIXME in every file ending in .rs", "r": "11,353 results", "t": [["syk", 56.0, 52.6, 620, "syk -U -Y -u all -s -a -c TODO|FIXME .rs"], ["rg", 70.1, 67.4, 745, "rg --no-config -n --no-heading -uu TODO|FIXME -g *.rs"], ["grep", 949.2, 912.8, 944, "grep -rnIE TODO|FIXME --include=*.rs ."]]}, {"n": "files that contain a match", "w": "paths of every file with async fn", "r": "3,384 results", "t": [["syk", 77.8, 76.1, 861, "syk -U -Y -u all -s -a -c async fn -l"], ["rg", 91.6, 84.6, 965, "rg --no-config -uu -l async fn"], ["grep", 876.0, 849.2, 871, "grep -rlI async fn ."]]}]}, {"h": "A small project", "s": "A folder with a few dozen files. Searched in the syk sources.", "c": [{"n": "content", "w": "lines with fn in the syk sources", "r": "745 results", "t": [["syk", 1.8, 1.5, 2, "syk -U -Y -u all -s -c fn"], ["rg", 3.7, 3.2, 4, "rg --no-config -n --no-heading fn"]]}, {"n": "names", "w": "entries whose name contains walk", "r": "1 results", "t": [["syk", 1.3, 1.0, 1, "syk -U -Y -u all -s -n walk"], ["fd", 4.2, 3.9, 5, "fd --no-global-ignore-file -s walk"]]}]}]};
const TOOLS = {
  "syk index": ["syk with index", "index"],
  "syk": ["syk", "syk"],
  "rg": ["ripgrep", "rg"],
  "rg + fd": ["ripgrep + fd", "rg"],
  "fd": ["fd", "fd"],
  "find": ["find", "find"],
  "grep": ["grep", "grep"],
};
const SHORT = { "syk index": "syk index", "rg + fd": "rg + fd" };
const runs = DATA.setup.runs;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function ms(value) {
  return (value < 100 ? value.toFixed(1) : Math.round(value).toLocaleString("en-US")) + " ms";
}

const setup = document.getElementById("setup");
for (const [label, value] of DATA.setup.shown) {
  setup.append(el("dt", "", label), el("dd", "", value));
}
document.getElementById("reading").textContent =
  `A bar is the fastest of ${runs} runs, which is the run that other programs disturbed least. ` +
  "Its length is relative to the slowest tool in the same case, so bars compare within a case and not between cases. " +
  "The number after the time is how many times the fastest tool's time it took.";
document.getElementById("method").textContent = DATA.setup.method;

const legend = document.getElementById("legend");
for (const key of ["syk index", "syk", "rg", "fd", "find", "grep"]) {
  const item = el("span", "key");
  const swatch = el("span", "swatch");
  swatch.style.background = `var(--${TOOLS[key][1]})`;
  item.append(swatch, el("span", "", TOOLS[key][0]));
  legend.append(item);
}

const chart = document.getElementById("chart");
const table = document.getElementById("table");
const tip = document.getElementById("tip");
const heading = el("tr");
for (const title of ["Case", "Tool", "Fastest", "Median", "CPU"]) heading.append(el("th", "", title));
table.append(heading);

function show(row, event) {
  const [tool, median, best, cpu, command] = row.data;
  tip.textContent = "";
  tip.append(
    el("b", "", TOOLS[tool][0]),
    el("div", "", `Fastest of ${runs} runs: ${ms(best)}`),
    el("div", "", `Median: ${ms(median)}`),
    el("div", "", `CPU time, all threads: ${ms(cpu)}`),
    el("code", "", command),
  );
  tip.style.display = "block";
  const box = row.getBoundingClientRect();
  const x = event && event.clientX ? event.clientX + 14 : box.left + 80;
  const y = event && event.clientY ? event.clientY + 14 : box.bottom + 4;
  tip.style.left = Math.max(4, Math.min(x, window.innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(4, Math.min(y, window.innerHeight - tip.offsetHeight - 8)) + "px";
}

function hide() {
  tip.style.display = "none";
}

for (const section of DATA.sections) {
  chart.append(el("h2", "", section.h), el("p", "soft", section.s));
  for (const item of section.c) {
    const box = el("div", "case");
    const head = el("div", "head");
    head.append(el("span", "name", item.n), el("span", "soft", `${item.w} · ${item.r}`));
    box.append(head);
    const slowest = Math.max(...item.t.map((tool) => tool[2]));
    const fastest = Math.min(...item.t.map((tool) => tool[2]));
    for (const tool of item.t) {
      const row = el("div", "row");
      row.tabIndex = 0;
      row.data = tool;
      const bar = el("span", "bar");
      bar.style.width = `calc((100% - 122px) * ${(tool[2] / slowest).toFixed(4)})`;
      bar.style.background = `var(--${TOOLS[tool[0]][1]})`;
      const track = el("span", "track");
      track.append(bar, el("span", "value" + (tool[2] === fastest ? " best" : ""), ms(tool[2])));
      if (tool[2] !== fastest) track.append(el("span", "value soft", (tool[2] / fastest).toFixed(1) + "×"));
      row.append(el("span", "tool", SHORT[tool[0]] || TOOLS[tool[0]][0]), track);
      row.addEventListener("mousemove", (event) => show(row, event));
      row.addEventListener("focus", () => show(row));
      row.addEventListener("mouseleave", hide);
      row.addEventListener("blur", hide);
      box.append(row);
      const line = el("tr");
      line.append(
        el("td", "", tool === item.t[0] ? `${section.h}: ${item.n}` : ""),
        el("td", "", TOOLS[tool[0]][0]),
        el("td", "", ms(tool[2])),
        el("td", "", ms(tool[1])),
        el("td", "", ms(tool[3])),
      );
      table.append(line);
    }
    chart.append(box);
  }
}
</script>
</body>
</html>
