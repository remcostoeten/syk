name: Publish

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, for example v0.1.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  start:
    name: Start publishing
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f tag="$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.event.workflow_run.head_branch }}

  crates:
    name: crates.io
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - run: '[[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
        shell: bash
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
        id: auth
      - run: scripts/publish.sh crates "$TAG"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  aur:
    name: AUR
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - run: '[[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
        shell: bash
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - run: scripts/publish.sh aur "$TAG"
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
